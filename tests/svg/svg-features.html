<!doctype html><html lang="ru"><head><meta charset="utf-8"><style>
@page{size:A4;margin:12mm} body{margin:0;font-family:"Liberation Sans";font-size:10pt}
.grid{display:flex;flex-wrap:wrap;gap:8px} .cell{width:170px;border:1px solid #ccc;padding:3px} .cell p{margin:0 0 3px;font-size:8pt}
svg.big{display:block}
.cls{fill:#e53935;stroke:#000;stroke-width:2}
</style></head><body>
<div class="grid">
<div class="cell"><p>Фигуры</p><svg width="160" height="100" viewBox="0 0 160 100">
 <rect x="5" y="5" width="60" height="40" fill="#43a047" stroke="#1b5e20" stroke-width="3"/>
 <rect x="75" y="5" width="70" height="40" rx="10" ry="20" fill="none" stroke="#1e88e5" stroke-width="4" stroke-dasharray="8 4"/>
 <circle cx="30" cy="75" r="20" fill="#fdd835" stroke="#f57f17" stroke-width="2"/>
 <ellipse cx="100" cy="75" rx="40" ry="18" fill="#8e24aa" fill-opacity="0.5"/>
 <line x1="5" y1="98" x2="155" y2="55" stroke="#000" stroke-width="2" stroke-linecap="round"/>
</svg></div>
<div class="cell"><p>Контуры, дуги, кривые</p><svg width="160" height="100" viewBox="0 0 160 100">
 <path d="M10 90 C 30 10, 70 10, 90 90 S 150 170 150 50" fill="none" stroke="#e53935" stroke-width="3"/>
 <path d="M20 20 a30 20 0 1 0 60 0 a30 20 0 1 0 -60 0z" fill="#90caf9" stroke="#0d47a1"/>
 <path d="M100,20 q25,-20 50,0 t 0,40" fill="none" stroke="#2e7d32" stroke-width="2"/>
 <polygon points="120,60 150,95 90,95" fill="#ffb300" stroke="#000" stroke-linejoin="round" stroke-width="3"/>
</svg></div>
<div class="cell"><p>Градиенты и прозрачность</p><svg width="160" height="100">
 <defs>
  <linearGradient id="lg" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="red"/><stop offset="50%" stop-color="yellow"/><stop offset="100%" stop-color="blue"/></linearGradient>
  <radialGradient id="rg" cx="50%" cy="50%" r="50%" fx="30%" fy="30%"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#2e7d32"/></radialGradient>
  <linearGradient id="lg2" href="#lg" gradientTransform="rotate(90)"/>
 </defs>
 <rect x="5" y="5" width="150" height="25" fill="url(#lg)"/>
 <circle cx="40" cy="65" r="30" fill="url(#rg)"/>
 <rect x="80" y="40" width="70" height="55" fill="url(#lg2)" opacity="0.6"/>
 <rect x="60" y="50" width="40" height="40" fill="rgba(0,0,255,0.4)"/>
</svg></div>
<div class="cell"><p>Преобразования, use, symbol</p><svg width="160" height="100" viewBox="0 0 160 100">
 <defs><symbol id="star" viewBox="0 0 20 20"><polygon points="10,1 12.5,7.5 19.5,7.5 14,12 16,19 10,15 4,19 6,12 0.5,7.5 7.5,7.5" fill="gold" stroke="#c62828"/></symbol>
 <g id="arrow"><path d="M0 0 L20 0 L20 -5 L30 5 L20 15 L20 10 L0 10z" fill="#5e35b1"/></g></defs>
 <use href="#star" x="5" y="5" width="30" height="30"/>
 <use href="#star" x="40" y="5" width="45" height="45"/>
 <use xlink:href="#star" x="90" y="0" width="20" height="20" transform="rotate(20 100 10)" xmlns:xlink="http://www.w3.org/1999/xlink"/>
 <use href="#arrow" x="10" y="60"/>
 <use href="#arrow" transform="translate(70 70) rotate(-30) scale(1.5)"/>
 <g transform="skewX(20) translate(100 55)"><rect width="30" height="30" fill="#00897b"/></g>
</svg></div>
<div class="cell"><p>Текст</p><svg width="160" height="100" viewBox="0 0 160 100">
 <text x="5" y="20" font-size="16" font-family="Liberation Serif">Обычный text</text>
 <text x="80" y="42" font-size="14" text-anchor="middle" fill="#c62828" font-weight="bold">По центру</text>
 <text x="155" y="60" font-size="12" text-anchor="end" font-style="italic">справа</text>
 <text x="5" y="85" font-size="14">H<tspan baseline-shift="sub" font-size="9">2</tspan>O и x<tspan dy="-6" font-size="9">2</tspan><tspan dy="6"> + </tspan><tspan fill="blue" text-decoration="underline">tspan</tspan></text>
 <text x="5" y="98" font-size="9" letter-spacing="2">р а з р я д к а</text>
</svg></div>
<div class="cell"><p>clipPath, pattern, маркеры</p><svg width="160" height="100" viewBox="0 0 160 100">
 <defs>
  <clipPath id="cp"><circle cx="35" cy="35" r="30"/></clipPath>
  <pattern id="pt" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="#ef6c00"/><rect x="5" y="5" width="5" height="5" fill="#ef6c00"/></pattern>
  <marker id="ar" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#000"/></marker>
 </defs>
 <g clip-path="url(#cp)"><rect x="0" y="0" width="70" height="35" fill="#1565c0"/><rect x="0" y="35" width="70" height="35" fill="#c62828"/></g>
 <rect x="80" y="5" width="70" height="60" fill="url(#pt)" stroke="#000"/>
 <polyline points="10,90 60,75 110,92 150,72" fill="none" stroke="#000" stroke-width="1.5" marker-start="url(#ar)" marker-end="url(#ar)"/>
</svg></div>
<div class="cell"><p>Стили &lt;style&gt; и классы</p><svg width="160" height="100" viewBox="0 0 160 100">
 <style>.a{fill:#26a69a} #b{fill:#ab47bc;stroke:#4a148c;stroke-width:3} g.k rect{fill:#ffca28} text{font-family:"Liberation Mono";font-size:11px}</style>
 <rect class="a" x="5" y="5" width="40" height="40"/>
 <rect id="b" x="55" y="5" width="40" height="40"/>
 <g class="k"><rect x="105" y="5" width="40" height="40"/></g>
 <circle class="cls" cx="30" cy="75" r="18"/>
 <text x="60" y="80" style="fill:#d81b60">style=""</text>
</svg></div>
<div class="cell"><p>viewBox + preserveAspectRatio</p>
 <svg width="160" height="45" viewBox="0 0 100 100" preserveAspectRatio="xMinYMid meet" style="background:#eee"><circle cx="50" cy="50" r="48" fill="#7cb342"/></svg>
 <svg width="160" height="45" viewBox="0 0 100 100" preserveAspectRatio="none" style="background:#eee"><circle cx="50" cy="50" r="48" fill="#7cb342"/></svg>
</div>
<div class="cell"><p>img src=*.svg и data: URI</p><img src="logo.svg" width="160">
<img src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='60' height='30'%3E%3Crect width='60' height='30' fill='%23e91e63'/%3E%3C/svg%3E"></div>
</div>
<p>SVG во всю ширину (только viewBox):</p>
<svg class="big" viewBox="0 0 400 60"><rect x="0" y="0" width="400" height="60" fill="#e3f2fd"/><path d="M0 50 Q 100 0 200 30 T 400 10" fill="none" stroke="#1565c0" stroke-width="3"/><text x="200" y="35" text-anchor="middle" font-size="18" fill="#0d47a1">Растягивается по ширине</text></svg>
</body></html>
