<!doctype html><html><head><meta charset="utf-8"><style>@page{size:A4;margin:12mm}body{font:12px Arial,sans-serif;margin:0}
h2{font-size:13px;margin:10px 0 4px}
.c{width:600px;background:#eceff1;padding:4px;gap:6px}
.c div{background:#b0bec5;border:1px solid #455a64;padding:4px}
.mr{display:grid;grid-template-columns:masonry;grid-template-rows:repeat(3,auto)}
.mc{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:masonry;height:160px;align-tracks:stretch,end,center,space-evenly}
.fr{display:flex;flex-direction:column} .fr>div{display:flex;gap:6px;background:none!important;border:0!important;padding:0!important}
.fc{display:flex;height:160px} .fc>div{flex:1;display:flex;flex-direction:column;gap:6px;background:none!important;border:0!important;padding:0!important}
</style></head><body><h2>Кладка по строкам (grid-template-columns: masonry)</h2><div class="c mr"><div style="width:120px">1</div><div style="width:80px">2</div><div style="width:150px">3</div><div style="width:60px">4</div><div style="width:100px">5</div><div style="width:90px">6</div><div style="width:140px">7</div><div style="width:70px">8</div><div style="width:110px">9</div></div><h2>justify-tracks: end, center, space-between</h2><div class="c mr" style="justify-tracks:end,center,space-between"><div style="width:120px">1</div><div style="width:80px">2</div><div style="width:150px">3</div><div style="width:60px">4</div><div style="width:100px">5</div><div style="width:90px">6</div><div style="width:140px">7</div><div style="width:70px">8</div><div style="width:110px">9</div></div><h2>align-tracks: stretch, end, center, space-evenly (height 160px)</h2><div class="c mc"><div style="height:30px">1</div><div style="height:50px">2</div><div style="height:20px">3</div><div style="height:40px">4</div><div style="height:25px">5</div><div style="height:35px">6</div><div style="height:45px">7</div><div style="height:20px">8</div></div></body></html>
